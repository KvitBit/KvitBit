\* Mutant: claim marks a queued delivery failed without sending: NoLostSend alone would pass, FailedOnlyAfterCall breaks.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
  SendReplayGuard = TRUE
  AdvanceBy = 1
  ClaimFailsQueued = TRUE
  RecordUnknownAsSent = FALSE
  GiveUpEarly = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
  FailedOnlyWhenJustified
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
