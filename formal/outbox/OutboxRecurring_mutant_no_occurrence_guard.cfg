\* Mutant: no once-per-occurrence guard (no schedule lock, no CAS advance, no unique link): two runs issue one occurrence twice.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = FALSE
  CasAdvance = FALSE
  UniqueLink = FALSE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
