\* Mutant (H3): no delivery reconcile (J1a); the only crash point is a delivery job between claim and the provider call: the delivery stays sending forever.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"dispatch"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = FALSE
  RecurringReconcile = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
PROPERTIES
  NoLostSend
