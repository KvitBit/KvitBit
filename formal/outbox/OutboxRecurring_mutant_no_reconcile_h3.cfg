\* Mutant: reconcileStaleDeliveries removed (DeliveryReconcile off, the code before 154383a); the only crash point is a delivery job between claim and the provider call (H3): the delivery stays sending forever.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"dispatch"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = FALSE
  RecurringReconcile = TRUE
  SendReplayGuard = TRUE
  AdvanceBy = 1
  ClaimFailsQueued = FALSE
  RecordUnknownAsSent = FALSE
  GiveUpEarly = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
  FailedOnlyWhenJustified
PROPERTIES
  NoLostSend
