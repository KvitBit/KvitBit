\* Mutant: as skip_occurrence, checked only for liveness (NextFollowsIssued left out): EveryOccurrenceIssued breaks.
CONSTANTS
  N = 2
  Workers = {w1, w2}
  MaxCrashes = 0
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
  SendReplayGuard = TRUE
  AdvanceBy = 2
  ClaimFailsQueued = FALSE
  RecordUnknownAsSent = FALSE
  GiveUpEarly = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
  FailedOnlyWhenJustified
PROPERTIES
  EveryOccurrenceIssued
