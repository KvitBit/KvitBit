\* Mutant: DeliveryJobs.start runs inside the send transaction (send.ts:242 without afterCommit): a rolled-back delivery gets a workflow.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = FALSE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
  SendReplayGuard = TRUE
  AdvanceBy = 1
  ClaimFailsQueued = FALSE
  RecordUnknownAsSent = FALSE
  GiveUpEarly = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
  FailedOnlyWhenJustified
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
