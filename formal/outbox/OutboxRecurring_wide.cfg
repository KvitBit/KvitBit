\* Wide (nightly, --wide): 2 occurrences, 2 workers, 2 crashes at any crash point, 1 duplicate or stale start, 1 provider failure, 1 dispatch attempt per execution.
CONSTANTS
  N = 2
  Workers = {w1, w2}
  MaxCrashes = 2
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
