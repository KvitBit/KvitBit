\* Mutant: the issue step re-issues instead of returning an issued run (issuance.ts:244-246 dropped): a rerun after a crash between issue and send is Skipped, the send is lost.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = FALSE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
PROPERTIES
  NoLostSend
