\* Mutant: the send step sends for a run that is already queued (issuance.ts:326-332, the queued replay and the pending-only check, dropped): two deliveries for one occurrence.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 1
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 1
  MaxAttempts = 1
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
  SendReplayGuard = FALSE
  AdvanceBy = 1
  ClaimFailsQueued = FALSE
  RecordUnknownAsSent = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
