\* Base: the code at 77a5bb7 plus the designed J1a delivery reconcile (DeliveryReconcile, not in core yet). 1 occurrence, 2 workers, 2 crashes at any crash point, 1 duplicate or stale start, 2 provider failures, 2 dispatch attempts per execution (so a retry and a giveUp are both reachable). Wide (nightly): OutboxRecurring_wide.cfg.
CONSTANTS
  N = 1
  Workers = {w1, w2}
  MaxCrashes = 2
  CrashPoints = {"worker", "claim", "dispatch", "record", "giveup"}
  MaxDupes = 1
  MaxSmtpFail = 2
  MaxAttempts = 2
  LockSchedule = TRUE
  CasAdvance = TRUE
  UniqueLink = TRUE
  ReplayGuard = TRUE
  StartAfterCommit = TRUE
  DeliveryReconcile = TRUE
  RecurringReconcile = TRUE
  SendReplayGuard = TRUE
  AdvanceBy = 1
  ClaimFailsQueued = FALSE
  RecordUnknownAsSent = FALSE
  GiveUpEarly = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDocumentPerOccurrence
  NextFollowsIssued
  OneDeliveryPerOccurrence
  StartedOnlyCommitted
  SentImpliesAccepted
  FailedOnlyAfterCall
  FailedOnlyWhenJustified
PROPERTIES
  EveryOccurrenceIssued
  NoLostSend
