\* Mutant: an override frees the document's old number. Must violate ReservedForever.
CONSTANTS
    Issuers = {i1, i2}
    Overriders = {o1}
    Periods = {p1, p2}
    MaxSeq = 3
    D0 = d0
    P0 = p1
    None = None
    Mutant = "release_old_number"
SPECIFICATION Spec
INVARIANTS TypeOK ReservedForever
