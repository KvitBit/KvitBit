\* Base: the code as written. 1 issue from a stored draft, 1 issue from input and 1 override over 2
\* periods, every statement interleaving, a rollback at any statement that is not waiting. Must pass.
CONSTANTS
    Issuers = {i1, i3}
    DraftIssuers = {i1}
    Overriders = {o1}
    Periods = {p1, p2}
    MaxSeq = 3
    D0 = d0
    P0 = p1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoDuplicateNumber NoReuse ReservedForever Gapless CounterTracksIssue
    NoOrphanReservation IssueNeverHitsIndex NoFkAbort
PROPERTY OverrideKeepsCounter
