\* Base: the code as written. 2 issues from stored drafts and 1 override over 2 periods, every statement
\* interleaving, a rollback at any statement that is not waiting. Must pass.
CONSTANTS
    Issuers = {i1, i2}
    DraftIssuers = {i1, i2}
    Overriders = {o1}
    Periods = {p1, p2}
    MaxSeq = 3
    D0 = d0
    P0 = p1
    None = None
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoDuplicateNumber NoReuse ReservedForever Gapless CounterTracksIssue
    NoOrphanReservation IssueNeverHitsIndex
PROPERTY OverrideKeepsCounter
