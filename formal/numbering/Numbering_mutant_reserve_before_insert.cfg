\* Mutant: an issue from input reserves its number before it inserts its document row (the order
\* before the F2 fix). Must violate NoFkAbort (number_reservations_document_fk aborts it).
CONSTANTS
    Issuers = {i1, i3}
    DraftIssuers = {i1}
    Overriders = {o1}
    Periods = {p1, p2}
    MaxSeq = 3
    D0 = d0
    P0 = p1
    None = None
    Mutant = "reserve_before_insert"
SPECIFICATION Spec
INVARIANTS TypeOK NoFkAbort
