\* Mutant: an override raises the series counter past the new number. Must violate OverrideKeepsCounter.
CONSTANTS
    Issuers = {i1, i2}
    DraftIssuers = {i1, i2}
    Overriders = {o1}
    Periods = {p1, p2}
    MaxSeq = 3
    D0 = d0
    P0 = p1
    None = None
    Mutant = "override_moves_counter"
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY OverrideKeepsCounter
