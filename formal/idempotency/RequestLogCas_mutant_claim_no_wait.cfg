\* Mutant: claim takes a key another transaction holds pending instead of waiting. Must violate AtMostOnceEffect.
SPECIFICATION Spec
CONSTANTS
  Attempts <- BaseAttempts
  Bug = "claim_no_wait"
INVARIANTS
  TypeOK
  AtMostOnceEffect
  ReplayReturnsStoredResult
  MismatchNeverReplayed
  MismatchOnlyForOtherPayload
  NoLostUpdate
  EntryHasCommittedOrigin
