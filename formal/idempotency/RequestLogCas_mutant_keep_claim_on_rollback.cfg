\* Mutant: a rolled-back transaction leaves its claim pending. Must deadlock (a retry waits forever).
SPECIFICATION Spec
CONSTANTS
  Attempts <- BaseAttempts
  Bug = "keep_claim_on_rollback"
INVARIANTS
  TypeOK
  AtMostOnceEffect
  ReplayReturnsStoredResult
  MismatchNeverReplayed
  MismatchOnlyForOtherPayload
  NoLostUpdate
