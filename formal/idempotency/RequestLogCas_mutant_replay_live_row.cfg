\* Mutant: a replay returns the live row instead of the stored result. Must violate ReplayReturnsStoredResult.
SPECIFICATION Spec
CONSTANTS
  Attempts <- BaseAttempts
  Bug = "replay_live_row"
INVARIANTS
  TypeOK
  ReplayReturnsStoredResult
  MismatchNeverReplayed
  MismatchOnlyForOtherPayload
  AtMostOnceEffect
  NoLostUpdate
  EntryHasCommittedOrigin
