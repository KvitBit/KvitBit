<!-- Kvitbit favicons. Paths assume assets/brand/web/ is served at /assets/brand/web/. -->
<!-- Modern browsers pick the scheme-adaptive SVG; the ICO (16/32/48) is the legacy fallback. favicon-16/32/48.png stay available for tooling that needs PNGs. -->
<link rel="icon" href="/assets/brand/web/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/brand/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brand/web/apple-touch-icon.png">
<link rel="manifest" href="/assets/brand/web/site.webmanifest">
<meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
